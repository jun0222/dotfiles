description = "Marp スライドを生成して PDF に出力する"
prompt = """
以下のトピックでMarpプレゼンテーションを生成してください。

トピック・引数: {{args}}

# 手順

## 1. 引数をパース
- トピック（必須）
- `--slides N`：スライド数（デフォルト: 8）
- `--theme <name>`：テーマ（デフォルト: default）
- `--out <file>`：出力ファイルパス（デフォルト: `./marp/<トピックをsnake_case>.md`）

## 2. Marp Markdown を生成してファイルに書き出す

フロントマター:
```
---
marp: true
theme: <theme>
paginate: true
header: "<トピック>"
footer: "© !{date +%Y}"
---
```

構成:
- 1枚目: タイトルスライド（`<!-- _class: lead -->`）
- 中間: 内容スライド（箇条書き・コード・表を適切に使う）
- 最後: まとめスライド
- `---` でスライドを区切る
- 日本語で書く（トピックが英語でも）

## 3. PDF を出力する

```
!{npx @marp-team/marp-cli <出力ファイルパス> --pdf --output <.pdfパス> --allow-local-files 2>&1}
```

## 4. 完了を伝える

生成したファイルパスとスライド枚数を1行で伝える。

# ルール
- 1スライド1メッセージを意識してシンプルに
- コードブロックや表を積極的に使う
"""
